clone:
  git:
    image: bash
    settings:
      lfs: false

labels:
  backend: local

steps:
  - name: migrate
    image: bash
    environment:
      DATABASE_URL:
        from_secret: DATABASE_URL
    commands:
      - export PATH="/usr/local/go/bin:/home/diama/go/bin:$PATH"
      - export GOMODCACHE="/home/diama/ci-caches/go-mod"
      - export GOCACHE="/home/diama/ci-caches/go-build"
      - go run ./cmd/migrate up

  - name: build
    image: bash
    commands:
      - export PATH="/usr/local/go/bin:/home/diama/go/bin:$PATH"
      - export GOMODCACHE="/home/diama/ci-caches/go-mod"
      - export GOCACHE="/home/diama/ci-caches/go-build"
      - go build -trimpath -o porto-api ./cmd/api
      - chmod a+x "$PWD" "$(dirname "$PWD")"
      - chmod a+r "$PWD/porto-api"
      - /usr/bin/sudo -n -u diama /home/diama/bin/porto-api-ci-deploy "$PWD/porto-api"

  - name: verify
    image: bash
    environment:
      PORT:
        from_secret: PORT
      API_KEY:
        from_secret: API_KEY
    commands:
      - 'curl -fsS -o /dev/null -w "health=%{http_code}\n" "http://127.0.0.1:$PORT/health"'
      - 'curl -fsS -o /dev/null -w "api=%{http_code}\n" -H "X-API-Key: $API_KEY" "http://127.0.0.1:$PORT/api/experiences?page=1&limit=1"'

when:
  - event: [push, manual]
    branch: [production]
